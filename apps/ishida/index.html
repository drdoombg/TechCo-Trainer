<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ishida Line Trainer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Training simulator for Ishida CommsBridge Desktop, CLARiSOFT and the ICE Zodiac Hawk labeller printer.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon-192.png">
<style>
:root{
  --bg:#f3f5f8; --panel:#ffffff; --ink:#1d2430; --muted:#5d6878; --line:#d6dbe3;
  --accent:#0b5fa5; --accent2:#e0662a; --ok:#1f9d55; --warn:#d99a06; --bad:#d23b3b;
  --tag-photo:#1f7a46; --tag-inf:#9a6a00; --tag-ass:#7a4bb3;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;color-scheme:light;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
button{font:inherit;cursor:pointer}
input,select{font:inherit}
.it-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:#fff;border-bottom:1px solid var(--line);padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.it-brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.it-brand img{width:28px;height:28px;border-radius:6px}
.it-brand small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.it-tabs{display:flex;flex-wrap:wrap;gap:4px;flex:1}
.it-tab{border:1px solid var(--line);background:#f7f9fb;border-radius:8px;padding:6px 10px;color:var(--ink)}
.it-tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.it-tab .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:6px;background:var(--ok);vertical-align:middle}
.it-tab .dot.amber{background:var(--warn)} .it-tab .dot.red{background:var(--bad)}
.it-reset{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px}
.it-reset.arm{background:var(--bad);border-color:var(--bad);color:#fff}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:#fff}
.it-main{padding-block:14px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1500px;margin:0 auto}
.it-panel{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
@media (max-width:980px){.it-panel{grid-template-columns:minmax(0,1fr)}}
.it-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.it-card h3{margin:0 0 6px;font-size:15px}
.it-card h4{margin:10px 0 4px;font-size:13px}
.it-card ul{margin:4px 0 0;padding-left:18px}
.it-card li{margin:2px 0}
.it-side{display:flex;flex-direction:column;gap:12px}
.it-tag{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;color:#fff;margin-right:6px;vertical-align:middle}
.it-tag.photo{background:var(--tag-photo)} .it-tag.inf{background:var(--tag-inf)} .it-tag.ass{background:var(--tag-ass)}
.it-tasks li{list-style:none;margin-left:-18px}
.it-tasks li::before{content:"☐ ";color:var(--muted)}
.it-tasks li.done::before{content:"☑ ";color:var(--ok)}
.it-tasks li.done{color:var(--muted);text-decoration:line-through}
.it-stagewrap{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;overflow:hidden}
.it-fit{position:relative;overflow:hidden;width:100%}
.it-fit>.it-scaled{position:absolute;left:0;top:0;transform-origin:0 0}
.it-strip{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.it-chip{border:1px solid var(--line);border-radius:999px;padding:5px 12px;background:#fff}
.it-chip.on{background:#e8f4ec;border-color:#9fd3b2}
.it-chip.off{background:#fbecec;border-color:#efb3b3}
.it-btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;padding:6px 12px}
.it-btn.ghost{background:#fff;color:var(--accent)}
.it-small{font-size:12px;color:var(--muted)}
.it-toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#1d2430;color:#fff;padding:9px 16px;border-radius:10px;z-index:999;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.it-labels{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.it-labels .lab{border:1px solid var(--line);border-radius:8px;padding:6px;background:#fff;width:100%;max-width:330px}
.it-labels svg{width:100%;height:auto;display:block}
.it-log{max-height:220px;overflow:auto;font-size:12px;font-family:Consolas,monospace;background:#f7f9fb;border:1px solid var(--line);border-radius:8px;padding:6px}
.it-log div{border-bottom:1px dashed #e3e7ee;padding:2px 0}

/* ===== Windows desktop (office PC) ===== */
.w-desk{width:1280px;height:800px;position:relative;background:linear-gradient(135deg,#3b2fa8,#5a2fb5 55%,#2f4ec9);overflow:hidden;font-family:"Segoe UI",Arial,sans-serif;font-size:12px;color:#111}
.w-desk .w-wall{position:absolute;right:60px;top:300px;color:#fff;text-align:right;opacity:.9}
.w-desk .w-wall b{font-size:30px;display:block;letter-spacing:1px}
.w-icons{position:absolute;left:10px;top:10px;display:grid;grid-template-columns:repeat(2,78px);gap:8px}
.w-ico{width:78px;color:#fff;text-align:center;font-size:11px;border:1px solid transparent;border-radius:4px;padding:4px 2px;background:none}
.w-ico:hover{background:rgba(255,255,255,.15)}
.w-ico i{display:block;width:34px;height:34px;margin:0 auto 3px;border-radius:6px;font-style:normal;font-weight:700;line-height:34px;font-size:15px}
.w-task{position:absolute;left:0;right:0;bottom:0;height:44px;background:rgba(235,238,245,.92);display:flex;justify-content:center;align-items:center;gap:6px;border-top:1px solid #c9cfd9}
.w-task button{height:36px;min-width:40px;border:none;border-radius:6px;background:transparent;padding:0 10px;font-size:12px}
.w-task button.act{background:#fff;box-shadow:inset 0 -3px 0 #0b5fa5}
.w-task .clock{position:absolute;right:12px;text-align:right;font-size:11px;line-height:1.2}
.w-win{position:absolute;background:#f0f0f0;border:1px solid #6b7a90;box-shadow:0 8px 28px rgba(0,0,0,.35);display:flex;flex-direction:column}
.w-win.focus{border-color:#0b5fa5}
.w-title{height:30px;background:#fff;display:flex;align-items:center;padding-left:8px;gap:6px;font-size:12px;cursor:move;user-select:none;border-bottom:1px solid #ddd}
.w-title span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w-title button{width:44px;height:30px;border:none;background:transparent;font-size:14px}
.w-title button.x:hover{background:#e81123;color:#fff}
.w-body{flex:1;position:relative;overflow:hidden}

/* ===== CommsBridge ===== */
.cb{position:absolute;inset:0;background:#f4efe6;font-family:Tahoma,Arial,sans-serif;font-size:12px}
.cb-tool{display:flex;align-items:center;gap:4px;padding:6px 8px;border-bottom:1px solid #cbbfa8}
.cb-tool button{width:38px;height:32px;border:1px solid #bfb39c;background:linear-gradient(#fff,#e9e2d4);border-radius:3px;font-size:16px;padding:0}
.cb-tool .lang{width:auto;padding:0 10px;font-size:12px;border:none;background:none}
.cb-tabs{display:flex;gap:2px;padding:4px 8px 0}
.cb-tabs button{border:1px solid #bfb39c;border-bottom:none;background:#e9e2d4;padding:3px 7px;font-size:12px;border-radius:3px 3px 0 0}
.cb-tabs button.on{background:#fff}
.cb-list{position:absolute;left:8px;top:84px;width:410px;bottom:8px;background:#fff;border:1px solid #9c907a;overflow:auto}
.cb-list table{border-collapse:collapse;width:100%}
.cb-list td{border:1px solid #c9c2b4;padding:1px 4px;white-space:nowrap;font-size:12px;cursor:default}
.cb-list td:first-child{width:56px}
.cb-list tr.sel td{background:#2a6fc0;color:#fff}
.cb-list tr:hover td{background:#e5eefb}
.cb-list tr.sel:hover td{background:#2a6fc0}
.cb-lines{position:absolute;left:426px;top:8px;right:8px}
.cb-line{display:flex;gap:8px;border:1px solid #d5ccba;background:#f7f3ec;margin-bottom:6px;padding:4px}
.cb-line .pic{width:100px;height:66px;background:#dfe3e8;border:1px solid #b9c0c9;display:flex;align-items:center;justify-content:center;font-size:10px;color:#556}
.cb-line b{font-weight:400;font-size:12px}
.cb-line .st{font-size:12px;line-height:1.35}
.cb-line .st i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.cb-line .st i.g{background:#1fa64a} .cb-line .st i.r{background:#d62d2d}
.cb-line .pend{font-size:11px;color:#a35a00}
.cb-ed{position:absolute;left:0;top:44px;right:0;bottom:0;background:#f1ece2;border:1px solid #8aa0b8;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.cb-ed .hd{background:#1e88c8;color:#fff;padding:3px 8px;font-size:11px}
.cb-ed .grid{position:absolute;left:8px;top:28px;right:74px;bottom:46px;border:1px solid #b9b0a0;display:grid;grid-template-columns:1fr 1fr;gap:0 8px;padding:4px;align-content:start}
.cb-f{display:flex;align-items:center;border:1px solid #c7bfae;background:#ece6da;margin:2px 0;height:25px}
.cb-f label{flex:1;padding-left:5px;font-size:12px;white-space:nowrap;overflow:hidden}
.cb-f input,.cb-f select{width:52%;height:21px;border:1px solid #b5ab98;background:#fbf9f5;text-align:right;font-size:12px;padding:0 4px;margin-right:2px}
.cb-f select{text-align:left}
.cb-f.red label{color:#c4241c}
.cb-f.dis label{color:#8e8a82}
.cb-f.dis input{color:#8e8a82}
.cb-f.wide input{text-align:left}
.cb-gap{height:25px;margin:2px 0}
.cb-pages{position:absolute;left:8px;bottom:8px;display:flex;gap:4px}
.cb-pages button{width:92px;height:30px;border:1px solid #b8ad98;background:#f6f2ea;font-size:13px}
.cb-pages button.red{color:#d0281d}
.cb-pages button.on{background:#a69c8a;color:#111}
.cb-side{position:absolute;right:8px;top:28px;width:56px;display:flex;flex-direction:column;align-items:center;gap:8px}
.cb-side button{width:50px;height:46px;border:1px solid #9fb2c9;background:#e9f1fb;font-size:20px;border-radius:4px}
.cb-side .rank{font-size:12px;margin-top:6px}
.cb-side .rn{font-size:20px;font-weight:700}
.cb-dlg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#f1ece2;border:1px solid #6d7f96;box-shadow:0 10px 30px rgba(0,0,0,.35);width:440px;z-index:5}
.cb-dlg .hd{background:#1e88c8;color:#fff;padding:4px 8px;font-size:12px}
.cb-dlg .bd{padding:10px;font-size:12px}
.cb-dlg .ft{display:flex;justify-content:flex-end;gap:6px;padding:8px}
.cb-dlg .ft button{min-width:80px;height:26px;border:1px solid #9c907a;background:#fbf9f5}
.cb-ph{position:absolute;left:8px;top:84px;width:410px;bottom:8px;background:#fff;border:1px solid #9c907a;padding:12px;color:#555}

/* ===== CLARiSOFT ===== */
.cs{position:absolute;inset:0;background:#f0f0f0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;font-size:12px}
.cs-menu{display:flex;gap:2px;padding:2px 4px;background:#fff;border-bottom:1px solid #ddd;position:relative;z-index:4}
.cs-menu>div{position:relative}
.cs-menu>div>button{border:none;background:none;padding:2px 8px}
.cs-menu>div>button:hover{background:#e5f1fb}
.cs-dd{position:absolute;left:0;top:22px;background:#fff;border:1px solid #aaa;box-shadow:2px 3px 8px rgba(0,0,0,.2);min-width:190px;z-index:6}
.cs-dd button{display:block;width:100%;text-align:left;border:none;background:none;padding:4px 18px}
.cs-dd button:hover{background:#e5f1fb}
.cs-dd button:disabled{color:#aaa}
.cs-tb{display:flex;align-items:center;gap:3px;padding:3px 4px;border-bottom:1px solid #ddd;background:#f7f7f7}
.cs-tb button{width:24px;height:22px;border:1px solid transparent;background:none;font-size:13px;padding:0}
.cs-tb button:hover{border-color:#9ac}
.cs-tb select{height:22px;font-size:12px}
.cs-tb .sep{width:1px;height:18px;background:#ccc;margin:0 3px}
.cs-box{position:absolute;left:0;top:56px;width:92px;bottom:22px;background:#6e6e6e;color:#eee}
.cs-box .t{background:#d9d9d9;color:#111;font-size:11px;padding:3px 4px}
.cs-box button{display:block;width:100%;border:none;background:none;color:#f0f0f0;font-size:10px;padding:5px 0 4px;text-align:center}
.cs-box button i{display:block;font-style:normal;font-size:18px;line-height:20px}
.cs-box button:hover{background:#7f7f7f}
.cs-work{position:absolute;left:92px;top:56px;right:0;bottom:22px;background:#d97d3a;overflow:auto}
.cs-ruler{position:sticky;top:0;height:18px;background:#fff;border-bottom:1px solid #aaa;z-index:2}
.cs-vruler{position:absolute;left:0;top:18px;width:18px;background:#fff;border-right:1px solid #aaa}
.cs-status{position:absolute;left:0;right:0;bottom:0;height:22px;background:#f0f0f0;border-top:1px solid #ccc;display:flex;gap:30px;align-items:center;padding:0 8px;font-size:11px}
.cs-el{cursor:move}
.cs-el.sel{outline:none}
.cs-splash{position:absolute;left:50%;top:50%;width:300px;height:340px;transform:translate(-50%,-50%);background:linear-gradient(#fff 0 26%,#e8873e 26%);border:1px solid #ccc;box-shadow:0 6px 24px rgba(0,0,0,.35);z-index:9;font-family:Arial}
.cs-splash .l{position:absolute;right:16px;top:20px;font-weight:700;color:#333;font-size:15px;text-align:right}
.cs-splash .l small{display:block;font-size:8px;font-weight:400}
.cs-splash .m{position:absolute;left:12px;bottom:40px;color:#fde;font-family:"Courier New",monospace;font-size:19px;line-height:1.1}
.cs-splash .i{position:absolute;left:4px;top:80px;font-size:9px;color:#333}
.cs-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px}
.cs-dlg{position:absolute;background:#f0f0f0;border:1px solid #2d6db5;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:8;font-size:12px}
.cs-dlg .hd{background:#1f6fc5;color:#fff;padding:5px 8px;display:flex;justify-content:space-between}
.cs-dlg .hd button{border:none;background:none;color:#fff;font-size:14px;line-height:1}
.cs-dlg .tabs{display:flex;gap:2px;padding:6px 8px 0}
.cs-dlg .tabs button{border:1px solid #bbb;border-bottom:none;background:#e7e7e7;padding:2px 8px}
.cs-dlg .tabs button.on{background:#fff}
.cs-dlg .bd{background:#fff;border:1px solid #bbb;margin:0 8px;padding:8px;min-height:380px}
.cs-dlg .ft{display:flex;justify-content:flex-end;gap:6px;padding:8px}
.cs-dlg .ft button{min-width:72px;height:24px;border:1px solid #adadad;background:#e1e1e1}
.cs-dlg label.f{display:block;margin:6px 0 2px;color:#222}
.cs-dlg input[type=text],.cs-dlg input[type=number],.cs-dlg select{height:22px;border:1px solid #9a9a9a;width:100%}
.cs-dlg .row{display:flex;gap:10px}
.cs-dlg .row>div{flex:1}
.cs-dlg .grp{border-top:1px solid #ccc;margin-top:8px;padding-top:2px;font-weight:600;color:#333}
.cs-dlg .ck{display:block;margin:4px 0}
.cs-dlg .prev{border:1px solid #ccc;background:#fafafa;padding:3px 6px;min-height:22px;font-family:Arial}
.cs-dlg .lst{height:150px;border:1px solid #9a9a9a;overflow:auto;background:#fff}
.cs-dlg .lst div{padding:1px 4px;cursor:default}
.cs-dlg .lst div.on{background:#0078d7;color:#fff}
.cs-msg{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);width:420px;background:#fff;border:1px solid #888;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:10}
.cs-msg .hd{padding:6px 10px;border-bottom:1px solid #ddd;font-size:12px}
.cs-msg .bd{padding:14px 12px;display:flex;gap:10px;font-size:12px}
.cs-msg .bd i{font-style:normal;font-size:26px}
.cs-msg .ft{background:#f0f0f0;padding:8px;display:flex;justify-content:flex-end;gap:6px}
.cs-msg .ft button{min-width:80px;height:24px}

/* ===== File Explorer ===== */
.ex{position:absolute;inset:0;background:#202124;color:#e8e8e8;font-family:"Segoe UI",Arial;font-size:12px}
.ex-bar{display:flex;gap:6px;align-items:center;padding:6px 8px;border-bottom:1px solid #3a3a3a}
.ex-bar button{background:#2d2e31;color:#ddd;border:1px solid #444;border-radius:4px;padding:2px 8px}
.ex-path{flex:1;background:#2d2e31;border:1px solid #444;border-radius:4px;padding:3px 8px}
.ex-nav{position:absolute;left:0;top:38px;bottom:0;width:150px;border-right:1px solid #3a3a3a;padding:6px}
.ex-nav div{padding:3px 6px;border-radius:4px;cursor:default}
.ex-nav div.on{background:#3a3b3e}
.ex-list{position:absolute;left:150px;right:0;top:38px;bottom:0;overflow:auto}
.ex-list table{border-collapse:collapse;width:100%}
.ex-list th{font-weight:400;color:#aaa;text-align:left;padding:4px 8px;border-bottom:1px solid #3a3a3a}
.ex-list td{padding:3px 8px;white-space:nowrap}
.ex-list tr.r:hover td{background:#2f3033}
.ex-list tr.sel td{background:#3d4a5c}

/* ===== ICE Zodiac Hawk CLARiTY ===== */
.hk{width:1024px;height:600px;background:#e9edf2;font-family:Arial,Helvetica,sans-serif;position:relative;overflow:hidden;color:#1a2433}
.hk-top{height:52px;background:#1c3b5e;color:#fff;display:flex;align-items:center;gap:14px;padding:0 14px}
.hk-top .nm{font-weight:700;font-size:17px}
.hk-top .st{padding:4px 12px;border-radius:4px;font-weight:700}
.hk-top .st.run{background:#22a35a} .hk-top .st.stop{background:#c43a3a} .hk-top .st.idle{background:#c98a10}
.hk-top .clk{margin-left:auto;font-size:14px;text-align:right}
.hk-fault{height:34px;display:flex;align-items:center;padding:0 14px;font-weight:700;font-size:14px;cursor:pointer}
.hk-fault.none{background:#d9e7d9;color:#245b2a;cursor:default}
.hk-fault.f{background:#d93a3a;color:#fff}
.hk-fault.w{background:#f2c94c;color:#3b2c00}
.hk-body{position:absolute;left:0;right:0;top:86px;bottom:84px;display:flex}
.hk-main{flex:1;padding:10px 14px;overflow:auto}
.hk-nav{width:190px;padding:10px;display:flex;flex-direction:column;gap:8px;background:#d6dde6}
.hk-nav button{height:58px;border:none;border-radius:8px;background:#2a5c8f;color:#fff;font-size:15px;font-weight:700}
.hk-nav button.on{background:#e0662a}
.hk-ctrl{position:absolute;left:0;right:0;bottom:0;height:84px;background:#c9d2dd;display:flex;align-items:center;gap:12px;padding:0 14px}
.hk-ctrl button{height:60px;min-width:150px;border:none;border-radius:8px;font-size:17px;font-weight:700;color:#fff;background:#4a6e94}
.hk-ctrl .start{background:#22a35a} .hk-ctrl .stop{background:#c43a3a}
.hk-ribbon{margin-left:auto;width:170px;font-size:12px}
.hk-ribbon .bar{height:14px;border-radius:7px;background:#fff;border:1px solid #889;overflow:hidden}
.hk-ribbon .bar i{display:block;height:100%}
.hk-prev{background:#fff;border:1px solid #9aa7b6;border-radius:6px;padding:8px;display:inline-block}
.hk-list{background:#fff;border:1px solid #9aa7b6;border-radius:6px;max-height:300px;overflow:auto}
.hk-list div{padding:9px 12px;border-bottom:1px solid #e1e6ec;font-size:15px;cursor:pointer}
.hk-list div.on{background:#2a5c8f;color:#fff}
.hk-btn{height:46px;min-width:120px;border:none;border-radius:8px;background:#2a5c8f;color:#fff;font-size:15px;font-weight:700;padding:0 14px}
.hk-btn.alt{background:#7d8ea3}
.hk-btn.ok{background:#22a35a}
.hk-btn:disabled,.hk-ctrl button:disabled{opacity:.4;cursor:not-allowed}
.hk-row{display:flex;gap:10px;align-items:center;margin:8px 0;flex-wrap:wrap}
.hk-in{height:42px;font-size:18px;border:2px solid #2a5c8f;border-radius:6px;padding:0 10px;width:200px}
.hk-kv{display:grid;grid-template-columns:220px 1fr;gap:6px 12px;font-size:15px}

.hk-h{font-size:18px;font-weight:700;margin:0 0 8px}

/* ===== Ishida WPL line screen ===== */
.wl{width:1024px;height:600px;background:#eef2f6;font-family:Arial,Helvetica,sans-serif;position:relative;color:#1a2433;overflow:hidden}
.wl-top{height:48px;background:#c8102e;color:#fff;display:flex;align-items:center;padding:0 14px;gap:16px;font-weight:700}
.wl-top .md{margin-left:auto;font-weight:400}
.wl-l{position:absolute;left:12px;top:60px;width:560px;bottom:12px}
.wl-r{position:absolute;right:12px;top:60px;width:430px;bottom:12px;display:flex;flex-direction:column;gap:10px}
.wl-box{background:#fff;border:1px solid #b8c3d0;border-radius:8px;padding:10px}
.wl-wt{font-family:"Consolas",monospace;font-size:64px;text-align:right;background:#0d1a26;color:#7cf29a;border-radius:6px;padding:4px 14px}
.wl-j{font-size:22px;font-weight:700;text-align:center;padding:6px;border-radius:6px}
.wl-j.ok{background:#d8f2df;color:#1b6b33} .wl-j.rej{background:#fadada;color:#9b1c1c} .wl-j.idle{background:#e5e9ee;color:#555}
.wl-btns{display:flex;gap:8px;flex-wrap:wrap}
.wl-btns button{height:54px;min-width:120px;border:none;border-radius:8px;font-weight:700;font-size:15px;color:#fff;background:#4a6e94}
.wl-btns .go{background:#22a35a} .wl-btns .st{background:#c43a3a}
.wl-sel{width:100%;height:36px;font-size:15px}
.wl-kv{display:grid;grid-template-columns:170px 1fr;gap:3px 10px;font-size:14px}
.wl-kv div:nth-child(odd){color:#596779}
.wl-msg{font-size:13px;max-height:140px;overflow:auto}
.wl-msg div{padding:2px 0;border-bottom:1px dashed #dde}

/* ===== How it connects ===== */
.cx-chain{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}
.cx-node{flex:1 1 150px;border:2px solid var(--line);border-radius:10px;padding:8px;background:#fff;min-width:140px}
.cx-node.ok{border-color:#9fd3b2;background:#f1faf4}
.cx-node.amber{border-color:#f0cf7a;background:#fff9e8}
.cx-node.red{border-color:#efb3b3;background:#fdf0f0}
.cx-node b{display:block;font-size:13px}
.cx-node span{font-size:12px;color:var(--muted)}
.cx-arrow{align-self:center;color:var(--muted);font-size:18px}
.cx-drill{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px;background:#fff}
.cx-drill.active{border-color:var(--accent);box-shadow:0 0 0 2px #cfe2f5}
.cx-drill ol{margin:6px 0 0;padding-left:20px}
.cx-drill li.done{color:var(--ok)}
.cx-drill li.done::marker{content:"✔ "}
.cx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}

<script>

/* ---- p2-hx.js ---- */
/* ===== p2-hx.js — shared data model, events, label renderer ===== */
(function(){
'use strict';
const KEY = 'ishidaTrainer.v1';   // change the version when the data shape changes
const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MON = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const DOW = ['SUN','MON','TUE','WED','THU','FRI','SAT'];

/* ---------- date helpers ---------- */
function dayOfYear(d){ const s = new Date(d.getFullYear(),0,0); return Math.floor((new Date(d.getFullYear(),d.getMonth(),d.getDate()) - s)/864e5); }
function addDays(d,n){ const x = new Date(d.getTime()); x.setDate(x.getDate()+n); return x; }
function ddmmm(d){ return String(d.getDate()).padStart(2,'0')+' '+MON[d.getMonth()]; }
/* Advanced Date Builder formats. First 8 + "y (2010 = 0)" + "JulDayZ(060)" seen in photos; the rest are assumed. */
const DATE_FORMATS = [
  ['d', d=>String(d.getDate())],
  ['Day of Month Code', d=>'ABCDEFGHIJKLMNOPQRSTUVWXYZ12345'[d.getDate()-1]],
  ['Day of Week Code', d=>'GABCDEF'[d.getDay()]],
  ['DayOfWeek(1-7)', d=>String(d.getDay()===0?7:d.getDay())],
  ['DayOfWeek(A-G)', d=>'GABCDEF'[d.getDay()]],
  ['dd', d=>String(d.getDate()).padStart(2,'0')],
  ['DDD', d=>DOW[d.getDay()]],
  ['ddd', d=>DOW[d.getDay()].charAt(0)+DOW[d.getDay()].slice(1).toLowerCase()],
  ['JulDay(60)', d=>String(dayOfYear(d))],
  ['JulDayZ(060)', d=>String(dayOfYear(d)).padStart(3,'0')],
  ['M', d=>String(d.getMonth()+1)],
  ['MM', d=>String(d.getMonth()+1).padStart(2,'0')],
  ['MMM', d=>MON[d.getMonth()]],
  ['WW', d=>{const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const dn=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-dn);const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));return String(Math.ceil(((t-y0)/864e5+1)/7)).padStart(2,'0');}],
  ['y (2010 = 0)', d=>String((d.getFullYear()-2010)%10)],
  ['yy', d=>String(d.getFullYear()).slice(2)],
  ['yyyy', d=>String(d.getFullYear())]
];
const DATE_FN = Object.fromEntries(DATE_FORMATS);
const SEPS = {'None':'', 'Space':' ', 'Slash(/)':'/', 'Dash(-)':'-', 'Dot(.)':'.'};
function fmtDateParts(d, parts, sep){
  return parts.map(p => p.startsWith('"') ? p.slice(1,-1) : (DATE_FN[p] ? DATE_FN[p](d) : '?')).join(SEPS[sep] || '');
}
function fmtTime(d, fmt, sep){
  const s = ({'Colon(:)':':','None':'','Dot(.)':'.'})[sep] ?? ':';
  const H = String(d.getHours()).padStart(2,'0'), m = String(d.getMinutes()).padStart(2,'0'), ss = String(d.getSeconds()).padStart(2,'0');
  if (fmt === 'HHmmss') return H+s+m+s+ss;
  if (fmt === 'hhmm') return String(((d.getHours()+11)%12)+1).padStart(2,'0')+s+m;
  return H+s+m;
}

/* ---------- EAN-13 ---------- */
const EAN_L = ['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'];
const EAN_G = ['0100111','0110011','0011011','0100001','0011101','0111001','0000101','0010001','0001001','0010111'];
const EAN_R = ['1110010','1100110','1101100','1000010','1011100','1001110','1010000','1000100','1001000','1110100'];
const EAN_P = ['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];
function eanCheck(d12){ let s=0; for(let i=0;i<12;i++) s += (+d12[i])*(i%2?3:1); return String((10 - s%10)%10); }
function eanModules(code){
  const d = code.split('').map(Number), p = EAN_P[d[0]];
  let m = '101';
  for (let i=1;i<=6;i++) m += (p[i-1]==='L'?EAN_L:EAN_G)[d[i]];
  m += '01010';
  for (let i=7;i<=12;i++) m += EAN_R[d[i]];
  return m + '101';
}

/* ---------- label jobs (CIFF) ---------- */
/* Element geometry in mm. ASDALARGE is from photos (JulianDate X 6.83 / Y 16.67 / W 4.58 / H 2.50 read directly). */
function baseJob(name, o){
  o = o || {};
  const els = [
    {id:'cook', kind:'text', name:'CookTime', x:4.6, y:2.4, size:3.4, bold:true, font:'Arial Narrow',
      text:{type:'Merge Field', value:'', mergeKey:'COOKTIME', sample:'1hr 46mins', maxChars:10, fixedLen:false, justify:'Left Justified', atCoder:false, promptVal:'Default Value', promptMsg:''}},
    {id:'hm', kind:'logo', name:'HealthMark', x:24.4, y:0.9, w:9.0, h:6.8, size:2.3, logo:{l1:'GB', l2:'2037'}},
    {id:'lineref', kind:'text', name:'LineRef', x:2.6, y:16.67, size:2.5, font:'Arial',
      text:{type:'Line Reference', value:'L1', maxChars:2, fixedLen:false, justify:'Left Justified', atCoder:true, promptVal:'Default Value', promptMsg:'Line number'}},
    {id:'julian', kind:'date', name:'JulianDate', x:6.83, y:16.67, size:2.5, font:'Arial',
      date:{fmt:'User Defined', parts:['y (2010 = 0)','JulDayZ(060)'], sep:'None', use:'Coder Date', dtype:'Current Date', offset:0, lang:'English', pad:false}},
    {id:'time', kind:'time', name:'PackTime', x:12.4, y:16.67, size:2.5, font:'Arial',
      time:{fmt:'HHmm', sep:'Colon(:)', use:'Coder Time', ttype:'Current Time', lang:'English'}},
    {id:'site', kind:'text', name:'SiteCode', x:19.0, y:16.3, size:2.9, font:'Arial',
      text:{type:'Fixed Text', value:'HDV', maxChars:3, fixedLen:false, justify:'Left Justified', atCoder:true, promptVal:'Default Value', promptMsg:'Site code'}},
    {id:'rule', kind:'line', name:'Rule', x:1.7, y:19.7, w:22.8, t:0.25},
    {id:'ean', kind:'barcode', name:'EAN13', x:1.6, y:20.4, size:2,
      bc:{sym:'EAN13', data:o.ean || '5057172354801', type:'Fixed Text', mergeKey:'', mag:75.7, height:10.75, hr:true, autoCheck:false, guard:true, quiet:false}},
    {id:'useby', kind:'text', name:'UseBy', x:28.3, y:20.1, size:3.9, bold:true, font:'Arial Narrow',
      text:{type:'Merge Field', value:'', mergeKey:'USEBY', sample:'23 SEP', maxChars:6, fixedLen:false, justify:'Left Justified', atCoder:false, promptVal:'Default Value', promptMsg:''}},
    {id:'weight', kind:'text', name:'Weight', x:39.6, y:20.1, size:3.6, bold:true, font:'Arial Narrow',
      text:{type:'Merge Field', value:'', mergeKey:'WEIGHT', sample:'2,148kg', maxChars:8, fixedLen:false, justify:'Left Justified', atCoder:false, promptVal:'Default Value', promptMsg:''}}
  ];
  if (o.price !== '') els.push({id:'price', kind:'text', name:'PricePerKg', x:43.6, y:29.0, size:4.3, bold:true, font:'Arial Narrow',
      text:{type:'Fixed Text', value:o.price || '5.22', maxChars:4, fixedLen:false, justify:'Left Justified', atCoder:false, promptVal:'Default Value', promptMsg:''}});
  return {name, printer:'Zodiac Hawk(53mm)', w:53, h:42, subImage:1, rev:1, els};
}
const JOB_LIST = [ // from the JOBS folder photo (Figure 4); "ALDI WB HWC - PZ NEW" is the job named in product 3024 (Figure 22)
  'ALDI WB (no price) NEW','ALDI WB (no price)','Iceland WB NEW-Not For EU - small','Iceland WB NEW-Not For EU','Iceland WB NEW-Not For EU no circle',
  'ALDI PCO RIB (Blank Price)','Cherrywood BWC - PZ SQUARE','Lidl WB - PZ SQUARE','TESCO WC (No price) - PZ SQUARE','TESCO WF WC- PZ SQUARE',
  'ASDA CHERRYWOOD','PZ SQUARE','ASDA PRICE','JS WB','JS XL WB','STAFF SHOP','WB TRIAL','ALDI WB (fixed price)','CO-OP WB',
  'JACKS WC (fixed price)','JACKS WC (variable price)','TESCO EL WC','TESCO WC (fixed price)','ALDI WB','Cherrywood BWC','Iceland WB','Lidl WB',
  'TESCO RoomToRoam WB','ALDI WB HWC - PZ NEW'
];
function initialPen(){
  const f = {};
  f['JOBS/ASDAPRICE UPDATE 2026/ASDALARGE.ciff']  = baseJob('ASDALARGE', {price:'5.22'});
  f['JOBS/ASDAPRICE UPDATE 2026/ASDAMEDIUM.ciff'] = baseJob('ASDAMEDIUM', {price:'5.22'});
  f['JOBS/ASDAPRICE UPDATE 2026/ASDAXL.ciff']     = baseJob('ASDAXL', {price:'5.22'});
  JOB_LIST.forEach(n => {
    const noPrice = /no price|blank price/i.test(n);
    f['JOBS/'+n+'.ciff'] = baseJob(n, {price: noPrice ? '' : '4.99', ean:'5000000000000'.slice(0,12)+eanCheck('500000000000')});
  });
  return f;
}

/* ---------- products (CommsBridge) ---------- */
const PRODUCT_NAMES = [ // from the product list photo (Figure 20)
  [4,'test average weighing'],[3007,'ALDI Medium W/Bird 1.40-1.80Kg Variable weight'],[3008,'ALDI Medium W/Bird 1.40-1.80Kg Variable weight'],
  [3014,'ALDI Large W/Bird 1.70-1.999Kg Variable weight'],[3015,'ALDI Large W/Bird 1.70-1.99Kg Variable weight'],
  [3023,'ALDI Extra Large W/Bird 2.00-2.30Kg Variable weight'],[3024,'ALDI Extra Large W/Bird 2.00-2.30Kg Variable weight'],
  [3065,'WB Large Plain CIB 1.65KG'],[5033,'CO-OP Large Whole Chicken 1.50-1.90KG CW'],[5035,'CO-OP MEDIUM Whole Chicken 1.46-1.75KG CW'],
  [5037,'CO-OP EXTRA LARGE Whole Chicken 1.91-2.30KG CW'],[5151,'CO-OP EXTRA LARGE Whole Chicken 1.91-2.30KG CW'],[5161,'CO-OP LARGE Whole Chicken 1.50-1.90KG CW'],
  [6018,'ASDA EXTRA LARGE 1.800 - 2.66KG'],[6121,'ASDA MEDIUM 1.450 - 1.69 KG<BR/>'],[6162,'ASDA MED 1.3-1.69KG'],[6163,'ASDA BS EXTRA LARGE 2.0 - 2.8KG'],
  [6164,'PZ ASDA MED 1.3-1.69KG'],[6165,'PZ ASDA BS EXTRA LARGE 2.0 - 2.8KG'],[6171,'ASDA LARGE 1.7 - 1.99KG'],[6172,'PZ ASDA LARGE 1.7 - 1.99KG'],
  [6173,'ASDA LARGE 1.7 - 1.99KG'],[6271,'ICELAND WHOLE BIRD SMALL 1.1-1.3KG'],[6272,'ICELAND WHOLE BIRD SMALL 1.1-1.3KG'],[6273,'ICELAND WHOLE BIRD SMALL 1.1-1.3KG'],
  [6281,'ICELAND WHOLE BIRD MEDIUM 1.3-1.7KG']
];
function guessJob(plu, name){
  if (plu === 3024 || plu === 3023) return 'ALDI WB HWC - PZ NEW';
  if (/^ALDI/.test(name)) return 'ALDI WB';
  if (/CO-OP/.test(name)) return 'CO-OP WB';
  if (/ASDA/.test(name)) return /EXTRA/.test(name) ? 'ASDAXL' : /MED/.test(name) ? 'ASDAMEDIUM' : 'ASDALARGE';
  if (/ICELAND/.test(name)) return 'Iceland WB';
  if (plu === 3065) return 'WB TRIAL';
  return '';
}
function makeProduct(plu, name){
  const m = name.match(/(\d+(?:\.\d+)?)\s*-\s*(\d+(?:\.\d+)?)\s*K/i);
  const lo = m ? Math.round(+m[1]*1000) : 0, hi = m ? Math.round(+m[2]*1000) : 0;
  const ext = guessJob(plu, name);
  const asda = /ASDA/.test(name);
  const p = {
    plu, name, customer:'', orderNo:1, orderQty:1000, tray:1, tare:8, md:1,
    packDate:'No print', packTime:'No print', sellByDate:'No print', sellByTime:'No print', useByDate:'Add days',
    conveyor:'6 (auto)', countMode:'Good packs only', extPrinter: ext ? 'In use' : 'Not in use', timeToPrint:0, sellByDays:1, timeToPrint2:0, useByDays: asda ? 7 : 10,
    cookFixed:20, cookPerKg: asda ? 40 : 45, drained:0, itemCode:0, extJob:ext, free:{},
    printerSwitching:'Do not switch', up1cas:0, up2cas:0, un1cas:0, un2cas:0,
    rank:'Yes', unitPrice:0, unitPer:'1kg', fixedPrice:0, fixedWeight:0, mdFlag:'No markdown', mdAmount:0,
    prodMode: lo ? 'Catch-weight' : 'Fixed weight', lower:lo, upper:hi, nominal:0, upperTol:0, t1:0, t2:0, printedQty:0,
    lot:'', img1:'', img2:'', img3:'', img4:'', img5:'', imgSel:'Not in use',
    up1p:'No print', up1f:1, up2p:'No print', up2f:1, un1p:'No print', un1f:1, un2p:'No print', un2f:1, colour:'Not in use',
    bcType:'Fixed GS1-13', bcStruct:'1: FFCCCCCxPPPPx', bcPrefix:'40', bcData:'8860016888', ean5Type:'Date/Time', ean5Data:'', trayBc:0
  };
  if (plu === 4){ p.prodMode='Catch-weight'; p.lower=500; p.upper=3000; }
  return p;
}
function initialProducts(){ const o = {}; PRODUCT_NAMES.forEach(([plu,n]) => o[plu] = makeProduct(plu,n)); return o; }

function initialState(){
  const products = initialProducts();
  const pen = initialPen();
  const hawkDb = {};
  Object.values(pen).forEach(j => hawkDb[j.name] = clone(j));
  return {
    v:1,
    products,
    lines:{
      L4:{name:'Line 4', conn:{pack:true, ctrl:true, cas:false}, products:clone(products), current:null, running:false, packs:0, rejects:0, last:null, msgs:[], printer:'HAWK'},
      L2:{name:'Line 2', conn:{pack:true, ctrl:true, cas:false}, products:clone(products), current:null, running:false, packs:0, rejects:0, last:null, msgs:[], printer:null},
      SIM:{name:'Simulator', conn:{pack:false, ctrl:false, cas:false}, products:{}, current:null, running:false, packs:0, rejects:0, last:null, msgs:[], printer:null}
    },
    usb:{dongle:'pc', pen:'pc'},
    pen,
    cs:{running:false, doc:null, path:null, dirty:false},
    hawk:{db:hawkDb, current:null, running:false, prompts:{}, pendingPrompt:false, faults:[], ribbon:820, ribbonWidth:55, clockOffsetMin:0,
          darkness:'Normal', printSpeed:300, printDelay:0, printed:0, lastLabel:null, mode:'Intermittent'},
    labels:[], log:[], done:{}, drill:null, cbLevel:4
  };
}

/* ---------- store ---------- */
let S;
try { S = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch(e){ S = null; }
if (!S || S.v !== 1) S = initialState();
const subs = [];
let saveT = null;
const HX = window.HX = {
  get s(){ return S; },
  clone, esc, MON, addDays, ddmmm, dayOfYear, DATE_FORMATS, fmtDateParts, fmtTime, eanCheck, baseJob, makeProduct,
  save(){ clearTimeout(saveT); saveT = setTimeout(()=>{ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }, 60); },
  emit(type, data){ HX.save(); subs.slice().forEach(fn => { try{ fn(type, data); } catch(e){ console.error(e); } }); },
  on(fn){ subs.push(fn); },
  reset(){ S = initialState(); try{ localStorage.removeItem(KEY); }catch(e){} HX.emit('reset'); },
  log(src, msg){ const t = new Date(); if (HX._logHook) HX._logHook('['+src+'] '+msg); S.log.unshift(t.toTimeString().slice(0,8)+'  ['+src+'] '+msg); S.log.length = Math.min(S.log.length, 200); },
  done(id){ if (!S.done[id]){ S.done[id] = Date.now(); HX.emit('task', id); } },
  isDone(id){ return !!S.done[id]; },
  toast(msg){ let t = document.querySelector('.it-toast'); if (!t){ t = document.createElement('div'); t.className = 'it-toast'; document.body.appendChild(t); } t.textContent = msg; t.hidden = false; clearTimeout(t._h); t._h = setTimeout(()=> t.hidden = true, 3200); },
  hawkNow(){ return new Date(Date.now() + S.hawk.clockOffsetMin*60000); },
  /* ---- copies and pending checks ---- */
  productPending(lineId, plu){ const L = S.lines[lineId]; if (!L.products[plu]) return true; return JSON.stringify(L.products[plu]) !== JSON.stringify(S.products[plu]); },
  linePendingCount(lineId){ return Object.keys(S.products).filter(p => HX.productPending(lineId, p)).length; },
  penJobByName(name){ return Object.entries(S.pen).find(([p,j]) => j.name === name); },
  jobPending(name){ const pj = HX.penJobByName(name); const hj = S.hawk.db[name]; if (!pj) return false; if (!hj) return true; return JSON.stringify(pj[1]) !== JSON.stringify(hj); },
  hawkPendingCount(){ return Object.values(S.pen).filter(j => HX.jobPending(j.name)).length; },
  docDirty(){ return !!(S.cs.doc && S.cs.dirty); },
  /* ---- Ishida merge data ---- */
  buildMerge(p, grams, when){
    const kg = grams/1000;
    const mins = grams > 0 ? Math.round(p.cookFixed + p.cookPerKg*kg) : 0;
    const m = {
      WEIGHT: kg.toFixed(3).replace('.', ',') + 'kg',
      COOKTIME: Math.floor(mins/60) + 'hr ' + String(mins%60).padStart(2,'0') + 'mins',

/* ---------- element value + renderer ---------- */
HX.elValue = function(el, ctx){
  const print = ctx.mode === 'print';
  if (el.kind === 'text'){
    const t = el.text;
    if (t.type === 'Merge Field') return print ? (ctx.merge && ctx.merge[t.mergeKey] != null ? ctx.merge[t.mergeKey] : '') : (t.sample || '['+t.mergeKey+']');
    let v = t.value;
    if (print && t.atCoder && ctx.prompts && ctx.prompts[el.id] != null) v = ctx.prompts[el.id];
    return t.maxChars ? String(v).slice(0, t.maxChars) : v;
  }
  if (el.kind === 'date'){
    const d = addDays(ctx.date || new Date(), +el.date.offset || 0);
    if (el.date.fmt === 'User Defined') return fmtDateParts(d, el.date.parts, el.date.sep);
    if (el.date.fmt === 'DD MMM') return ddmmm(d);
    if (el.date.fmt === 'dd/MM/yy') return fmtDateParts(d, ['dd','MM','yy'], 'Slash(/)');
    return fmtDateParts(d, ['dd','MMM','yy'], 'Space');
  }
  if (el.kind === 'time') return fmtTime(ctx.date || new Date(), el.time.fmt, el.time.sep);
  if (el.kind === 'barcode'){
    const b = el.bc;
    let v = b.type === 'Merge Field' ? (print ? (ctx.merge && ctx.merge[b.mergeKey]) || '' : b.data) : b.data;
    return String(v);
  }
  return '';
};
/* Character pitch measured from the photos: JulianDate "6311" at 2.50 mm high is 4.58 mm wide (0.458 × height). Narrow font ≈ 0.40.

function textWidth(str, size, bold, font){ const k = /Narrow/.test(font) ? 0.40 : 0.458; return String(str).length * size * k; }
HX.elBox = function(el, ctx){
  if (el.kind === 'logo') return {x:el.x, y:el.y, w:el.w, h:el.h};
  if (el.kind === 'line') return {x:el.x, y:el.y-0.6, w:el.w, h:1.2};
  if (el.kind === 'barcode'){ const mod = 0.33*el.bc.mag/100; return {x:el.x, y:el.y, w:(95+ (el.bc.hr?7:0))*mod, h:el.bc.height + (el.bc.hr ? 2.4 : 0)}; }

};
HX.renderJobSVG = function(job, ctx, opts){
  opts = opts || {};

  let s = '';

    const hide = el.printed === false && ctx.mode === 'print';
    if (hide) return;
    const ghost = el.printed === false ? ' opacity="0.35"' : '';
    let g = '';
    const rot = el.orient ? ` transform="rotate(${el.orient} ${el.x} ${el.y})"` : '';
    if (el.kind === 'text' || el.kind === 'date' || el.kind === 'time'){
      const v = HX.elValue(el, ctx);
      const fam = /Narrow/.test(el.font) ? "'Arial Narrow','Roboto Condensed','Helvetica Neue',Arial,sans-serif" : "Arial,Helvetica,sans-serif";
      const stretch = /Narrow/.test(el.font) ? ' font-stretch="condensed"' : '';
      g = `<text x="${el.x}" y="${(el.y + el.size*0.82).toFixed(2)}" font-size="${el.size}" font-family="${fam}"${stretch} font-weight="${el.bold?700:400}"${String(v).length?` textLength="${textWidth(v, el.size, el.bold, el.font).toFixed(2)}" lengthAdjust="spacingAndGlyphs"`:''} fill="#000"${el.inverse?' style="paint-order:stroke" stroke="#000"':''}>${esc(v)}</text>`;

      g = `<ellipse cx="${cx}" cy="${cy}" rx="${el.w/2-0.2}" ry="${el.h/2-0.2}" fill="none" stroke="#000" stroke-width="0.35"/>`+
          `<text x="${cx}" y="${cy-0.25}" font-size="${el.size}" text-anchor="middle" font-family="Arial" font-weight="700">${esc(el.logo.l1)}</text>`+
          `<text x="${cx}" y="${cy+el.size*0.95}" font-size="${el.size}" text-anchor="middle" font-family="Arial" font-weight="700">${esc(el.logo.l2)}</text>`;
    } else if (el.kind === 'line'){
      g = `<rect x="${el.x}" y="${el.y}" width="${el.w}" height="${el.t}" fill="#000"/>`;
    } else if (el.kind === 'barcode'){
      let code = HX.elValue(el, ctx).replace(/\D/g,'');

          hr += `<text x="${el.x}" y="${ty}" font-size="2.1" font-family="'OCR B',Consolas,monospace">${code[0]}</text>`;
          for (let i=0;i<6;i++) hr += `<text x="${(x0+(4+i*7)*mod).toFixed(2)}" y="${ty}" font-size="2.1" font-family="'OCR B',Consolas,monospace">${code[1+i]}</text>`;

/* ---------- fit helper (fixed-size replicas, uniform scale) ---------- */
HX.fit = function(wrap, W, H, maxH){
  const inner = wrap.querySelector('.it-scaled');
  const cw = wrap.clientWidth || W;
  const mh = maxH || Math.max(320, window.innerHeight - 150);
  const k = Math.min(cw / W, mh / H, 1.25);
  inner.style.width = W+'px'; inner.style.height = H+'px';
  inner.style.transform = 'scale('+k+')';
  wrap.style.height = Math.ceil(H*k)+'px';
  wrap._k = k;
};

/* ===== p5-clarisoft.js — CLARiSOFT Generic Image Design Software (ICE / Videojet) ===== */
(function(){
'use strict';
const S = () => HX.s, esc = HX.esc;
const ui = { splash:false, sel:null, menu:null, dlg:null, msg:null, zoom:450, adb:null, dragging:null, pending:null };
const CS = () => S().cs;
const ppm = () => ui.zoom/100*2.67;
const winPath = p => 'F:\\' + p.replace(/\//g,'\\');

function launch(then){
  if (S().usb.dongle !== 'pc'){
    ui.msg = {title:'CLARiSOFT', icon:'⛔', text:'No valid CLARiSOFT licence was found. Insert the licence key (dongle) and start CLARiSOFT again.', btns:['OK'], then:'quit'};
    HX.desk.open('cs'); HX.log('CLARiSOFT', 'Start failed: no licence dongle'); return;
  }
  CS().running = true; ui.splash = true; HX.desk.open('cs'); HX.done('cs-launch');
  setTimeout(() => { ui.splash = false; if (then) then(); HX.emit('cs'); }, 1200);
}
function openFile(path){
  if (!CS().running){ launch(() => openFile(path)); return; }
  if (CS().dirty){ ui.msg = {title:'CLARiSOFT', icon:'❓', text:'Save changes to the current job first?', btns:['Yes','No','Cancel'], then:'open', path}; HX.emit('cs'); return; }
  const j = S().pen[path]; if (!j){ HX.toast('File not found.'); return; }
  CS().doc = HX.clone(j); delete CS().doc._saved; CS().path = path; CS().dirty = false; ui.sel = null;
  if (/ASDALARGE/.test(path)) HX.done('cs-open');
  HX.log('CLARiSOFT', 'Opened ' + winPath(path));
  HX.desk.open('cs'); HX.emit('cs');
}
function save(asName){
  const c = CS();
  if (!c.doc) return;
  if (c.noLic){ ui.msg = {title:'CLARiSOFT', icon:'⛔', text:'The licence key has been removed. Saving is disabled until the dongle is put back.', btns:['OK']}; return; }
  let path = c.path;
  if (asName){ path = (c.path ? c.path.split('/').slice(0,-1).join('/') : 'JOBS') + '/' + asName + '.ciff'; c.doc.name = asName; }
  if (!path){ ui.dlg = {kind:'saveas', name:c.doc.name}; return; }
  if (S().usb.pen !== 'pc'){ ui.msg = {title:'CLARiSOFT', icon:'⚠', text:`Cannot save ${winPath(path)}.\nThe drive F: is not available. Plug the pen drive back into the PC.`, btns:['OK']}; HX.log('CLARiSOFT','Save failed: F: not available'); return; }
  const d = HX.clone(c.doc); d.rev = (d.rev||1) + 1; c.doc.rev = d.rev;
  const now = new Date(); d._saved = now.toLocaleDateString('en-GB') + ' ' + now.toTimeString().slice(0,5);
  S().pen[path] = d; c.path = path; c.dirty = false;
  HX.log('CLARiSOFT', 'Saved ' + winPath(path) + ' (job name "' + d.name + '")');
  HX.done('cs-save');
}
HX.cs = {
  openFile, launch,
  lostLicence(){ CS().noLic = true; ui.msg = {title:'CLARiSOFT', icon:'⚠', text:'The licence key (dongle) was removed. You can look at the job but not save it until the dongle is back.', btns:['OK']}; }
};
HX.on(t => { if (t === 'usb' && S().usb.dongle === 'pc') CS().noLic = false; });

/* ---------- canvas ---------- */
function canvasHtml(){
  const d = CS().doc, k = ppm();
  if (!d) return `<div class="cs-empty">Use File › Open to open a .CIFF job from the pen drive (F:\\JOBS).</div>`;
  const W = d.w*k, H = d.h*k, ox = 18, oy = 6;
  let ticks = '';
  for (let mm=0; mm<=Math.ceil(1200/k); mm+=5){ const x = ox + mm*k; ticks += `<div style="position:absolute;left:${x}px;bottom:0;height:${mm%10?5:9}px;border-left:1px solid #555"></div>` + (mm%10===0 && mm ? `<div style="position:absolute;left:${x+2}px;top:0;font-size:9px">${mm}|</div>` : ''); }
  let vt = ''; for (let mm=10; mm<=d.h; mm+=10) vt += `<div style="position:absolute;top:${oy+mm*k}px;left:2px;font-size:9px;transform:rotate(-90deg)">${mm}</div>`;
  const ctx = {mode:'design', date:new Date()};
  let grid = ''; for (let gx=0; gx<=d.w; gx+=5) grid += `<line x1="${gx}" y1="0" x2="${gx}" y2="${d.h}" stroke="#bbb" stroke-width="0.06" stroke-dasharray="0.4 0.4"/>`;
  for (let gy=0; gy<=d.h; gy+=5) grid += `<line x1="0" y1="${gy}" x2="${d.w}" y2="${gy}" stroke="#bbb" stroke-width="0.06" stroke-dasharray="0.4 0.4"/>`;
  return `<div class="cs-ruler">${ticks}</div><div class="cs-vruler" style="height:${H+40}px">${vt}</div>
    <svg id="csSvg" style="position:absolute;left:${ox}px;top:${18+oy}px;background:#fff" width="${W}" height="${H}" viewBox="0 0 ${d.w} ${d.h}" xmlns="http://www.w3.org/2000/svg">${grid}${HX.renderJobSVG(d, ctx, {sel:ui.sel, hit:true})}</svg>
    <div style="position:absolute;left:${ox+W+40}px;top:${40}px;color:#fff;opacity:.55;font-size:13px;width:300px">Outside the 53 mm print area (Zodiac Hawk 53 mm printhead).<br><br>${HX.tag('inf')}The photo shows faded fields here (SC0242, £, 0,00 £/kg, 6,55£, 0219136006552). They look like another sub-image or non-printed fields. The status bar says "Sub-Image 1".</div>`;
}

const KIND_TITLE = {text:'Text Properties', date:'Date Properties', time:'Time Properties', barcode:'EAN13 Properties', logo:'Logo Properties', line:'Drawing Properties'};

    case 'hk-stop': h.running = false; HX.log('ICE Hawk','Stop'); break;
    case 'hk-test': {
      const r = HX.hawk.print({COOKTIME:'', WEIGHT:'', USEBY:'', SELLBY:'', PRICE:''}, {line:'ICE Test Print', plu:'—', test:true, manual:true});
      HX.toast(r.ok ? 'Test Print sent (merge fields empty).' : 'Test Print failed: ' + r.why); break;
    }
    case 'hk-reg': HX.toast('Print Registration: lines up the print position on the label (not simulated).'); return;
    case 'hk-fault': ui.view = 'fault'; break;
    case 'hk-ribbon': h.ribbon = 1200; HX.log('ICE Hawk','New ribbon fitted (1200 m)'); break;
    case 'hk-cas': { const f = h.faults.find(x => x.code === 'CAS'); if (f) f.fixed = true; break; }
    case 'hk-clear': { const f = h.faults.shift(); if (f) HX.log('ICE Hawk', 'Cleared: ' + f.text); HX.done('hk-clear'); ui.view = 'home'; break; }
    case 'hk-clk': h.clockOffsetMin += +t.dataset.d; HX.log('ICE Hawk', 'Printer clock changed'); break;
    case 'hk-clk0': h.clockOffsetMin = 0; HX.log('ICE Hawk', 'Printer clock set to real time'); HX.done('hk-clock'); break;
    case 'hk-import': { const r = HX.hawk.importUSB(); HX.toast(r.ok ? `Loaded from USB: ${r.n} job(s) new or changed.` : r.why); break; }
    case 'hk-dbsel': ui.dbSel = t.dataset.n; break;
    case 'hk-dbdel': if (ui.dbSel){ delete h.db[ui.dbSel]; if (h.current === ui.dbSel) h.current = null; HX.log('ICE Hawk', `Job "${ui.dbSel}" deleted from printer database`); ui.dbSel = null; } break;
  }
  HX.emit('hawk');
}

function startDrill(id){
  const d = DRILLS.find(x => x.id === id);
  S().drill = {id, step:0, seen:[], printed0:S().hawk.printed, t0:Date.now()};
  if (d.setup) d.setup();
  HX.log('Trainer', 'Drill started: ' + d.title);
  HX.emit('drill');
}
function advance(){
  const dr = S().drill; if (!dr) return;
  const d = DRILLS.find(x => x.id === dr.id); if (!d) return;
  let moved = false;
  while (dr.step < d.steps.length && d.steps[dr.step].ok()){
    dr.step++; moved = true;
    dr.printed0 = S().hawk.printed;   // the next "label a pack" step needs a label printed after this point
  }
  if (moved && dr.step >= d.steps.filter(s=>!s.optional).length && !dr.done){ dr.done = Date.now(); HX.done('drill-'+d.id); HX.toast('Drill complete: ' + d.title); }
}

  mainEl.appendChild(sec);
  panels[a.id] = sec;
  a.mount(sec.querySelector('.it-stagecol'));
});
function tabs(){
  tabsEl.innerHTML = HX.apps.map(a => `<button class="it-tab" role="tab" data-tab="${a.id}" aria-selected="${a.id===active}">${esc(a.label)}<span class="dot ${a.dot()==='ok'?'':a.dot()}"></span></button>`).join('');
}
function side(){
  const a = HX.apps.find(x => x.id === active), sec = panels[active];
  const n = HX.notes[a.noteKey()] || HX.notes[a.id] || {title:'', lines:[]};
  sec.querySelector('.it-notes').innerHTML = `<h3>${HX.tag(n.tag||'photo')} ${esc(n.title)}</h3><ul>${n.lines.map(l=>`<li>${l}</li>`).join('')}</ul>`;
  const groups = active === 'cx' ? DRILLS.map(d => ({id:'drill-'+d.id, text:'Drill: '+d.title})) : (HX.tasks[active] || []);
  sec.querySelector('.it-taskcard').innerHTML = `<h3>Tasks</h3><ul class="it-tasks">${groups.map(t=>`<li class="${HX.isDone(t.id)?'done':''}">${esc(t.text)}</li>`).join('')}</ul>
    <p class="it-small">${groups.filter(t=>HX.isDone(t.id)).length} of ${groups.length} done</p>`;
}
function show(id){
  active = id; try { localStorage.setItem('ishidaTrainer.tab', id); } catch(e){}
  Object.entries(panels).forEach(([k,p]) => p.hidden = k !== id);
  const a = HX.apps.find(x => x.id === id);
  a.render(); if (a.fit) a.fit(); tabs(); side();
}
HX.app = { side, show };
tabsEl.addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) show(b.dataset.tab); });
const resetBtn = document.getElementById('itReset');
resetBtn.addEventListener('click', () => {
  if (resetBtn.classList.contains('arm')){ resetBtn.classList.remove('arm'); resetBtn.textContent = 'Reset trainer'; HX.reset(); HX.toast('Trainer reset to the photographed starting state.'); return; }
  resetBtn.classList.add('arm'); resetBtn.textContent = 'Click again to reset everything';
  setTimeout(() => { resetBtn.classList.remove('arm'); resetBtn.textContent = 'Reset trainer'; }, 4000);
});
let raf = null;
HX.on(() => { if (raf) return; raf = requestAnimationFrame(() => { raf = null; const a = HX.apps.find(x => x.id === active); a.render(); if (a.fit) a.fit(); tabs(); side(); }); });
window.addEventListener('resize', () => { const a = HX.apps.find(x => x.id === active); if (a.fit) a.fit(); });
setInterval(() => { if (active === 'hawk' || active === 'pc'){ const a = HX.apps.find(x => x.id === active); if (active === 'hawk') a.render(); } }, 30000);
show(active);
})();

</script>
